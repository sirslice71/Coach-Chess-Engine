<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Coach 1.0.0 Chess Engine</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <aside id="leftPanel">

        <h2>Coach <span class="appVersion">1.0.0</span></h2>

        <div class="controls">

            <button id="newGameBtn">New Game</button>

            <div id="newGameChooser"
                 class="newGameChooser hidden">

                <span>Play as</span>

                <div class="segmentedControl">

                    <button id="newGameWhiteBtn"
                            class="segment"
                            type="button">White</button>

                    <button id="newGameBlackBtn"
                            class="segment"
                            type="button">Black</button>

                </div>

                <button id="newGameCancelBtn"
                        class="secondaryButton"
                        type="button">Cancel</button>

            </div>

            <button id="undoBtn">Undo</button>

            <button id="flipBtn">Flip Board</button>

            <button id="hintBtn">Hint</button>

            <button id="resignBtn">Resign</button>

        </div>

        <div class="difficulty">

            <label>Coach Search</label>

            <select id="difficulty">

                <option value="2">Depth 2 (Fast)</option>
                <option value="4">Depth 4</option>
                <option value="5" selected>Depth 5 (Default)</option>
                <option value="6">Depth 6</option>
                <option value="8">Depth 8 (Slow)</option>

            </select>

        </div>

        <div class="moveInput">

            <label>Move Input</label>

            <div class="segmentedControl"
                 role="group"
                 aria-label="Move input">

                <button id="dragMoveModeBtn"
                        class="segment active"
                        type="button"
                        aria-pressed="true">
                    Drag
                </button>

                <button id="clickMoveModeBtn"
                        class="segment"
                        type="button"
                        aria-pressed="false">
                    Click
                </button>

            </div>

        </div>

        <label class="toggleOption">

            <input id="moveHintsToggle"
                   type="checkbox"
                   checked>

            <span>Move Hints</span>

        </label>

        <div id="thinkingBox">
        
            <div id="engine-panel"></div>

        </div>

    </aside>

<main>

    <div id="boardContainer">

        <div id="board"></div>

    </div>

</main>

    <aside id="rightPanel">

        <div class="sideTabs">

            <button class="sideTab active"
                    id="gameTabBtn"
                    type="button">Game</button>

            <button class="sideTab"
                    id="labTabBtn"
                    type="button">Import</button>

        </div>

        <section id="gamePanel"
                 class="sidePane active">

        <div id="gameStatus"
             class="gameStatus"
             role="status"
             aria-live="polite">Ready.</div>

        <h3>Move History</h3>

        <div id="moveHistory"></div>

        <h3>Captured Pieces</h3>

        <div class="capturedGroup">
            <span>White pieces lost</span>
            <div id="capturedWhite"></div>
        </div>

        <div class="capturedGroup">
            <span>Black pieces lost</span>
            <div id="capturedBlack"></div>
        </div>

        </section>

        <section id="labPanel"
                 class="sidePane">

            <h3>Analysis Import</h3>

            <label class="filePicker">
                <span>Coach analysis JSON</span>
                <input id="labFileInput"
                       type="file"
                       accept="application/json,.json">
            </label>

            <div id="labStatus"
                 class="labStatus"></div>

            <div id="labSummary"
                 class="labSummary"></div>

            <div id="labCandidates"
                 class="labCandidates"></div>

            <div id="labDetail"
                 class="labDetail"></div>

        </section>

    </aside>

</div>

<script type="module" src="./js/main.js"></script>

</body>
</html>
