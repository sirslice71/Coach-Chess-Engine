<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Coach Chess Engine</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <aside id="leftPanel">

        <h2>Coach</h2>

        <div class="controls">

            <button id="newGameBtn">New Game</button>

            <div id="newGameChooser"
                 class="newGameChooser hidden">

                <span>Play as</span>

                <div class="segmentedControl">

                    <button id="newGameWhiteBtn"
                            class="segment"
                            type="button">White</button>

                    <button id="newGameBlackBtn"
                            class="segment"
                            type="button">Black</button>

                </div>

                <button id="newGameCancelBtn"
                        class="secondaryButton"
                        type="button">Cancel</button>

            </div>

            <button id="undoBtn">Undo</button>

            <button id="flipBtn">Flip Board</button>

            <button id="hintBtn">Hint</button>

            <button id="resignBtn">Resign</button>

        </div>

        <div class="difficulty">

            <label>Coach Strength</label>

            <select id="difficulty">

                <option value="2">Beginner</option>
                <option value="4">Intermediate</option>
                <option value="5" selected>Strong</option>
                <option value="6">Expert</option>
                <option value="8">Deep</option>

            </select>

        </div>

        <div class="moveInput">

            <label>Move Input</label>

            <div class="segmentedControl"
                 role="group"
                 aria-label="Move input">

                <button id="dragMoveModeBtn"
                        class="segment active"
                        type="button"
                        aria-pressed="true">
                    Drag
                </button>

                <button id="clickMoveModeBtn"
                        class="segment"
                        type="button"
                        aria-pressed="false">
                    Click
                </button>

            </div>

        </div>

        <label class="toggleOption">

            <input id="moveHintsToggle"
                   type="checkbox"
                   checked>

            <span>Move Hints</span>

        </label>

        <div id="thinkingBox">
        
            <div id="engine-panel"></div>

            <hr>

            <div id="developerPanel">

            <h4>Evaluation Breakdown</h4>

            <hr>

            <div>Material: <span id="devMaterial">0.00</span></div>

            <div>Opening: <span id="devOpening">0.00</span></div>

            <div>Piece Squares: <span id="devPieceSquares">0.00</span></div>

            <div>Position: <span id="devPosition">0.00</span></div>

            <div>King: <span id="devKing">0.00</span></div>

            <div>Pawns: <span id="devPawns">0.00</span></div>

            <div>Mobility: <span id="devMobility">0.00</span></div>

            <div>Tactics: <span id="devTactics">0.00</span></div>
            
            </div>

        </div>

    </aside>

<main>

    <div id="boardContainer">

        <div id="board"></div>

    </div>

</main>

    <aside id="rightPanel">

        <div class="sideTabs">

            <button class="sideTab active"
                    id="gameTabBtn"
                    type="button">Game</button>

            <button class="sideTab"
                    id="labTabBtn"
                    type="button">Lab</button>

        </div>

        <section id="gamePanel"
                 class="sidePane active">

        <h3>Move History</h3>

        <div id="moveHistory"></div>

        <h3>Captured Pieces</h3>

        <div id="capturedWhite"></div>

        <div id="capturedBlack"></div>

        <h3>Review Tools</h3>

        <div class="reviewActions">

            <button id="infiniteAnalysisBtn"
                    type="button">Start Analysis</button>

            <button id="stopAnalysisBtn"
                    type="button">Stop Analysis</button>

            <button id="gameAnalysisBtn"
                    type="button">Analyze Game</button>

        </div>

        <div id="gameAnalysisOutput"
             class="analysisOutput"></div>

        </section>

        <section id="labPanel"
                 class="sidePane">

            <h3>Coach Lab</h3>

            <label class="filePicker">
                <span>Analysis JSON</span>
                <input id="labFileInput"
                       type="file"
                       accept="application/json,.json">
            </label>

            <div id="labStatus"
                 class="labStatus"></div>

            <div id="labSummary"
                 class="labSummary"></div>

            <div id="labCandidates"
                 class="labCandidates"></div>

            <div id="labDetail"
                 class="labDetail"></div>

        </section>

    </aside>

</div>

<script type="module" src="./js/main.js"></script>

</body>
</html>
